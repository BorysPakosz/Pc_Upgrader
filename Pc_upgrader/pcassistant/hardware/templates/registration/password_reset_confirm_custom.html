{% extends "hardware/base.html" %}
{% block title %}Ustaw nowe hasło{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-3 text-center">🔐 Ustaw nowe hasło</h2>

    {% if validlink %}
      <form method="post" class="card p-3 p-md-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-success">Zmień hasło</button>
        </div>
      </form>
    {% else %}
      <div class="card p-4 shadow-sm text-center">
        <p class="text-danger mb-3">Link jest nieprawidłowy lub wygasł.</p>
        <a class="btn btn-outline-primary" href="{% url 'password_reset' %}">Poproś o nowy link</a>
      </div>
    {% endif %}

    <div class="text-center mt-3">
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'hardware:login' %}">⬅️ Wróć do logowania</a>
    </div>
  </div>
</div>
{% endblock %}
