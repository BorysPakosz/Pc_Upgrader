{% extends "hardware/base.html" %}
{% block title %}Rejestracja{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-4 text-center">Utwórz konto</h2>

    <form method="post" class="card p-3 p-md-4 shadow-sm">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-grid gap-2">
        <button class="btn btn-success" type="submit">Zarejestruj</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'hardware:login' %}">Mam już konto – Zaloguj</a>
    </div>
  </div>
</div>
{% endblock %}
