{% extends "hardware/base.html" %}
{% block title %}Reset hasła{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-3 text-center">🔑 Reset hasła</h2>
    <p class="text-muted text-center mb-4">Podaj adres e-mail powiązany z kontem.</p>

    <form method="post" class="card p-3 p-md-4 shadow-sm">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Wyślij link resetujący</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'hardware:login' %}">⬅️ Wróć do logowania</a>
    </div>
  </div>
</div>
{% endblock %}
