{% extends "hardware/base.html" %}
{% block title %}Edytuj komputer{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-edit"></i>
                        Edytuj komputer: {{ computer.name }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nazwa zestawu *</label>
                                <input type="text" name="name" class="form-control" 
                                       value="{{ computer.name }}" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Zdjęcie zestawu</label>
                                <input type="file" name="image" class="form-control" accept="image/*">
                                {% if computer.image %}
                                    <small class="text-muted">Obecne zdjęcie: {{ computer.image.name }}</small>
                                {% endif %}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Opis (opcjonalnie)</label>
                            <textarea name="description" class="form-control" rows="3">{{ computer.description }}</textarea>
                        </div>

                        <h5 class="text-primary mb-3">
                            <i class="fas fa-microchip"></i>
                            Komponenty
                        </h5>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Procesor (CPU) *</label>
                                <input type="text" name="cpu_name" class="form-control" 
                                       value="{{ computer.cpu_name }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Karta graficzna (GPU) *</label>
                                <input type="text" name="gpu_name" class="form-control" 
                                       value="{{ computer.gpu_name }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Płyta główna *</label>
                                <input type="text" name="motherboard_name" class="form-control" 
                                       value="{{ computer.motherboard_name }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Pamięć RAM *</label>
                                <input type="text" name="ram_name" class="form-control" 
                                       value="{{ computer.ram_name }}" required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Zasilacz (PSU)</label>
                                <select name="psu_watt" class="form-select" required>
                                    <option value="450" {% if computer.psu_watt == 450 %}selected{% endif %}>450W</option>
                                    <option value="500" {% if computer.psu_watt == 500 %}selected{% endif %}>500W</option>
                                    <option value="550" {% if computer.psu_watt == 550 %}selected{% endif %}>550W</option>
                                    <option value="600" {% if computer.psu_watt == 600 %}selected{% endif %}>600W</option>
                                    <option value="650" {% if computer.psu_watt == 650 %}selected{% endif %}>650W</option>
                                    <option value="750" {% if computer.psu_watt == 750 %}selected{% endif %}>750W</option>
                                    <option value="850" {% if computer.psu_watt == 850 %}selected{% endif %}>850W</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Dysk SSD</label>
                                <select name="ssd_size" class="form-select" required>
                                    <option value="240" {% if computer.ssd_size == 240 %}selected{% endif %}>240 GB</option>
                                    <option value="512" {% if computer.ssd_size == 512 %}selected{% endif %}>512 GB</option>
                                    <option value="1000" {% if computer.ssd_size == 1000 %}selected{% endif %}>1 TB</option>
                                    <option value="2000" {% if computer.ssd_size == 2000 %}selected{% endif %}>2 TB</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Dysk HDD</label>
                                <select name="hdd_size" class="form-select" required>
                                    <option value="0" {% if computer.hdd_size == 0 %}selected{% endif %}>Brak HDD</option>
                                    <option value="1000" {% if computer.hdd_size == 1000 %}selected{% endif %}>1 TB</option>
                                    <option value="2000" {% if computer.hdd_size == 2000 %}selected{% endif %}>2 TB</option>
                                    <option value="4000" {% if computer.hdd_size == 4000 %}selected{% endif %}>4 TB</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="text-info mb-3">
                            <i class="fas fa-cog"></i>
                            Ustawienia
                        </h5>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-check mb-3">
                                    <input type="checkbox" name="is_public" class="form-check-input" id="isPublic" 
                                           {% if computer.is_public %}checked{% endif %}>
                                    <label class="form-check-label" for="isPublic">
                                        <i class="fas fa-globe text-success"></i>
                                        Udostępnij publicznie w galerii
                                    </label>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="form-check mb-3">
                                    <input type="checkbox" name="allow_comments" class="form-check-input" id="allowComments" 
                                           {% if computer.allow_comments %}checked{% endif %}>
                                    <label class="form-check-label" for="allowComments">
                                        <i class="fas fa-comments text-primary"></i>
                                        Zezwalaj na komentarze
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'hardware:my_computers' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i>
                                Anuluj
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                Zapisz zmiany
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    <script>
// ===== AUTOCOMPLETE SYSTEM =====
class ComponentAutocomplete {
    constructor(inputId, componentType, displaySpecs = false) {
        this.input = document.getElementById(inputId);
        this.componentType = componentType;
        this.displaySpecs = displaySpecs;
        this.suggestions = [];
        this.selectedIndex = -1;
        
        if (!this.input) return;
        
        this.createSuggestionsContainer();
        this.attachEventListeners();
    }
    
    createSuggestionsContainer() {
        this.suggestionsContainer = document.createElement('div');
        this.suggestionsContainer.className = 'autocomplete-suggestions';
        this.suggestionsContainer.style.cssText = `
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        `;
        
        // Ustaw pozycję względną dla rodzica
        this.input.parentElement.style.position = 'relative';
        this.input.parentElement.appendChild(this.suggestionsContainer);
    }
    
    attachEventListeners() {
        this.input.addEventListener('input', this.handleInput.bind(this));
        this.input.addEventListener('keydown', this.handleKeydown.bind(this));
        this.input.addEventListener('blur', this.handleBlur.bind(this));
        this.input.addEventListener('focus', this.handleFocus.bind(this));
    }
    
    handleInput(e) {
        const query = e.target.value.trim();
        
        if (query.length < 2) {
            this.hideSuggestions();
            return;
        }
        
        this.fetchSuggestions(query);
    }
    
    handleKeydown(e) {
        if (!this.suggestionsContainer.style.display || this.suggestionsContainer.style.display === 'none') {
            return;
        }
        
        switch (e.key) {
            case 'ArrowDown':
                e.preventDefault();
                this.selectedIndex = Math.min(this.selectedIndex + 1, this.suggestions.length - 1);
                this.updateSelection();
                break;
                
            case 'ArrowUp':
                e.preventDefault();
                this.selectedIndex = Math.max(this.selectedIndex - 1, -1);
                this.updateSelection();
                break;
                
            case 'Enter':
                e.preventDefault();
                if (this.selectedIndex >= 0) {
                    this.selectSuggestion(this.suggestions[this.selectedIndex]);
                }
                break;
                
            case 'Escape':
                this.hideSuggestions();
                break;
        }
    }
    
    handleBlur(e) {
        // Opóźnienie żeby kliknięcie na sugestię zadziałało
        setTimeout(() => this.hideSuggestions(), 150);
    }
    
    handleFocus(e) {
        if (this.input.value.length >= 2) {
            this.fetchSuggestions(this.input.value.trim());
        }
    }
    
    fetchSuggestions(query) {
        fetch(`/component-autocomplete/?type=${this.componentType}&q=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                this.suggestions = data.suggestions || [];
                this.showSuggestions();
            })
            .catch(error => {
                console.error('Błąd autocomplete:', error);
            });
    }
    
    showSuggestions() {
        if (this.suggestions.length === 0) {
            this.hideSuggestions();
            return;
        }
        
        this.suggestionsContainer.innerHTML = '';
        this.selectedIndex = -1;
        
        this.suggestions.forEach((suggestion, index) => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item';
            item.style.cssText = `
                padding: 10px;
                cursor: pointer;
                border-bottom: 1px solid #eee;
                transition: background-color 0.2s;
            `;
            
            item.innerHTML = `
                <div class="fw-bold">${this.highlightMatch(suggestion.value, this.input.value)}</div>
                ${this.displaySpecs ? this.getSpecsHtml(suggestion) : ''}
            `;
            
            item.addEventListener('mouseenter', () => {
                this.selectedIndex = index;
                this.updateSelection();
            });
            
            item.addEventListener('click', () => {
                this.selectSuggestion(suggestion);
            });
            
            this.suggestionsContainer.appendChild(item);
        });
        
        this.suggestionsContainer.style.display = 'block';
    }
    
    getSpecsHtml(suggestion) {
        let specs = '<small class="text-muted">';
        
        if (this.componentType === 'cpu' && suggestion.socket) {
            specs += `Socket: ${suggestion.socket}`;
            if (suggestion.benchmark) {
                specs += ` | ${suggestion.benchmark} pkt`;
            }
        } else if (this.componentType === 'gpu' && suggestion.benchmark) {
            specs += `${suggestion.benchmark} pkt benchmark`;
        } else if (this.componentType === 'motherboard' && suggestion.socket) {
            specs += `Socket: ${suggestion.socket}`;
            if (suggestion.chipset) {
                specs += ` | ${suggestion.chipset}`;
            }
        } else if (this.componentType === 'ram') {
            if (suggestion.size) specs += `${suggestion.size}`;
            if (suggestion.clock) specs += ` ${suggestion.clock}MHz`;
            if (suggestion.type) specs += ` ${suggestion.type}`;
        }
        
        specs += '</small>';
        return specs;
    }
    
    highlightMatch(text, query) {
        if (!query) return text;
        
        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }
    
    updateSelection() {
        const items = this.suggestionsContainer.querySelectorAll('.autocomplete-item');
        
        items.forEach((item, index) => {
            if (index === this.selectedIndex) {
                item.style.backgroundColor = '#e3f2fd';
            } else {
                item.style.backgroundColor = 'white';
            }
        });
    }
    
    selectSuggestion(suggestion) {
        this.input.value = suggestion.value;
        this.hideSuggestions();
        
        // Wywołaj event change
        this.input.dispatchEvent(new Event('change', { bubbles: true }));
        
        // Sprawdź kompatybilność socketów jeśli to CPU lub płyta główna
        if (this.componentType === 'cpu' || this.componentType === 'motherboard') {
            setTimeout(checkSocketCompatibility, 100);
        }
    }
    
    hideSuggestions() {
        this.suggestionsContainer.style.display = 'none';
        this.selectedIndex = -1;
    }
}

// ===== WALIDACJA KOMPATYBILNOŚCI SOCKETÓW =====
function checkSocketCompatibility() {
    const cpuInput = document.querySelector('input[name="cpu_name"]');
    const moboInput = document.querySelector('input[name="motherboard_name"]');
    
    if (!cpuInput.value || !moboInput.value) {
        resetCompatibilityStatus();
        return;
    }
    
    // Sprawdź kompatybilność przez API (podobnie jak w upgraderze)
    // Tutaj możesz dodać logikę sprawdzania kompatybilności
    // Dla uproszczenia, na razie tylko pokazujemy że system działa
    console.log('Sprawdzanie kompatybilności:', cpuInput.value, 'vs', moboInput.value);
}

function resetCompatibilityStatus() {
    // Reset statusu kompatybilności
    const cpuField = document.querySelector('input[name="cpu_name"]').closest('.mb-3');
    const moboField = document.querySelector('input[name="motherboard_name"]').closest('.mb-3');
    
    if (cpuField) cpuField.classList.remove('compatible', 'incompatible');
    if (moboField) moboField.classList.remove('compatible', 'incompatible');
}

// ===== INICJALIZACJA =====
document.addEventListener('DOMContentLoaded', function() {
    // Znajdź pola input po name zamiast id
    const cpuInput = document.querySelector('input[name="cpu_name"]');
    const gpuInput = document.querySelector('input[name="gpu_name"]');
    const moboInput = document.querySelector('input[name="motherboard_name"]');
    const ramInput = document.querySelector('input[name="ram_name"]');
    
    // Ustaw unikalne ID dla autocomplete
    if (cpuInput) {
        cpuInput.id = 'cpu_name_edit';
        new ComponentAutocomplete('cpu_name_edit', 'cpu', true);
    }
    
    if (gpuInput) {
        gpuInput.id = 'gpu_name_edit';
        new ComponentAutocomplete('gpu_name_edit', 'gpu', true);
    }
    
    if (moboInput) {
        moboInput.id = 'motherboard_name_edit';
        new ComponentAutocomplete('motherboard_name_edit', 'motherboard', true);
    }
    
    if (ramInput) {
        ramInput.id = 'ram_name_edit';
        new ComponentAutocomplete('ram_name_edit', 'ram', true);
    }
    
    console.log('Autocomplete zainicjalizowany dla formularza edycji');
});

</script>

<style>

.autocomplete-item:hover {
    background-color: #f8f9fa !important;
}

.autocomplete-item mark {
    background-color: #fff3cd;
    padding: 0 2px;
    border-radius: 2px;
}

    border-color: #28a745 !important;
    box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25) !important;

    border-color: #dc3545 !important;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;

{% endblock %}
