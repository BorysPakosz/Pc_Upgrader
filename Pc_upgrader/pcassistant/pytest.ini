# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = pcassistant.settings
python_files = test_*.py
addopts =
    -ra -q
    --strict-markers
    --disable-warnings
    --cov=hardware --cov-report=term-missing
markers =
    unit: szybkie testy jednostkowe bez bazy
    db: testy Django z bazą danych
    e2e: testy end-to-end (Selenium)